<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Foloma Visão 360 — DIAGNÓSTICO</title>
  <style>
    :root {
      --bg: #020617; --card: #0f172a; --border: #1e293b; --accent: #00f0b5; --danger: #ff4d4d; --text: #e2e8f0; --muted: #64748b; --warning: #ffaa00; --purple: #8b5cf6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #020617; color: var(--text); min-height: 100vh; }
    .diagnostic { background: #111; color: #0f0; padding: 10px; margin: 10px; font-size: 10px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; border-radius: 8px; border: 1px solid #333; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #020617; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .logo { font-weight: 800; font-size: 15px; color: var(--accent); }
    .container { max-width: 500px; margin: auto; padding: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
    .card-title { font-size: 10px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    button { padding: 10px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: .2s; font-size: 13px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-buy { background: var(--accent); color: #000; }
    .btn-sell { background: var(--danger); }
    .bmr { background: var(--card); color: white; border: none; padding: 6px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 11px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="top-bar">
  <div class="logo">FOLOMA VISÃO 360 — DIAGNÓSTICO</div>
</div>
<div class="diagnostic" id="diagnostic">A aguardar primeira resposta do /api/status...</div>
<div class="container" id="mainContent" style="display:none">
  <div class="card">
    <div class="card-title">📡 STATUS <span id="bal">0.00</span> <span id="cur">USD</span></div>
    <div id="conSt">Desconectado</div>
    <div>
      <button class="bmr" onclick="connectWithDeriv()">🔗 Deriv</button>
      <button class="bmr" onclick="conectar()">🔌 Token</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🎲 DÍGITOS</div>
    <div class="big-d" id="bigD">—</div>
    <div class="big-p" id="bigP">AGUARDANDO</div>
    <div>
      <button class="btn-buy" id="btnOdd" disabled>ÍMPAR</button>
      <button class="btn-sell" id="btnEven" disabled>PAR</button>
    </div>
  </div>
</div>
<script>
function $_(id) { return document.getElementById(id); }

async function updateDiagnostic() {
  try {
    const r = await fetch('/api/status');
    const data = await r.json();
    $_('diagnostic').textContent = JSON.stringify(data, null, 2);
    // Atualizar interface básica
    if (data.bot) {
      $_('bal').textContent = (data.bot.balance||0).toFixed(2);
      $_('cur').textContent = data.bot.currency||'USD';
      $_('conSt').textContent = data.bot.connected ? 'Conectado' : 'Desconectado';
      // Mostrar estratégia
      if (data.strategy) {
        const s = data.strategy;
        // Usar parity_available e differ_available
        $_('btnOdd').disabled = !s.parity_available;
        $_('btnEven').disabled = !s.parity_available;
        // Se ambos estiverem disponíveis, mostrar direção
        if (s.parity_direction === 'odd') { $_('btnEven').disabled = true; }
        if (s.parity_direction === 'even') { $_('btnOdd').disabled = true; }
      }
    }
  } catch(e) {
    $_('diagnostic').textContent = 'ERRO: ' + e.message;
  }
}

// Iniciar polling
$_('mainContent').style.display = 'block';
updateDiagnostic();
setInterval(updateDiagnostic, 3000);

// Funções mínimas para botões
function connectWithDeriv(){ alert('Função OAuth não implementada no modo diagnóstico.'); }
function conectar(){ alert('Função Token não implementada no modo diagnóstico.'); }
</script>
</body>
</html>
