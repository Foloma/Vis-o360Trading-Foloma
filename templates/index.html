<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Foloma Visão 360</title>
  <style>
    :root {
      --bg: #020617;
      --card: #0f172a;
      --border: #1e293b;
      --accent: #00f0b5;
      --danger: #ff4d4d;
      --text: #e2e8f0;
      --muted: #64748b;
      --warning: #ffaa00;
      --purple: #8b5cf6;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #020617; color: var(--text); min-height: 100vh; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #020617; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .logo { font-weight: 800; font-size: 15px; color: var(--accent); }
    .container { max-width: 500px; margin: auto; padding: 8px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
    .card-title { font-size: 10px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    button { padding: 10px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: .2s; font-size: 13px; }
    button:active { transform: scale(.97); }
    .btn-buy { background: var(--accent); color: #000; }
    .btn-sell { background: var(--danger); }
    .bmr { background: var(--card); color: white; border: none; padding: 6px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 11px; }
    .hidden { display: none; }
    .dig-main { background: linear-gradient(135deg, #020617, #0f172a); padding: 10px; text-align: center; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; }
    .big-d { font-size: 64px; font-weight: 900; line-height: 1; }
    .big-d.odd { color: var(--accent); } .big-d.even { color: var(--danger); } .big-d.wait { color: var(--muted); }
    .big-p { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .hist-row { display: flex; gap: 3px; width: max-content; padding: 1px; }
    .dbox { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 700; flex-shrink: 0; background: #020617; }
    .dbox.odd { color: var(--accent); border: 1.5px solid var(--accent); } .dbox.even { color: var(--danger); border: 1.5px solid var(--danger); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card); border-radius: 12px; padding: 10px 18px; font-size: 12px; z-index: 2000; display: none; text-align: center; max-width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
    .toast.show { display: block; animation: su .3s ease; }
    @keyframes su { from { transform: translateX(-50%) translateY(12px); opacity: 0 } to { transform: translateX(-50%) translateY(0); opacity: 1 } }
    .signal-alert { background: var(--warning); color: #000; font-size: 12px; padding: 6px 10px; border-radius: 8px; text-align: center; margin-top: 4px; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="top-bar">
  <div class="logo">FOLOMA VISÃO 360</div>
</div>
<div class="container" id="mainContent">
  <!-- STATUS -->
  <div class="card">
    <div class="card-title">📡 STATUS <span id="bal">0.00</span> <span id="cur">USD</span></div>
    <div id="conSt">Desconectado</div>
    <div>
      <button class="bmr" onclick="connectWithDeriv()">🔗 Deriv</button>
      <button class="bmr" onclick="conectar()">🔌 Token</button>
    </div>
  </div>

  <!-- MODO DÍGITOS -->
  <div class="card">
    <div class="card-title">🎲 DÍGITOS</div>
    <div class="dig-main">
      <div class="big-d wait" id="bigD">—</div>
      <div class="big-p wait" id="bigP">AGUARDANDO</div>
    </div>
    <div class="hist-row" id="histRow" style="overflow-x:auto;padding-bottom:4px;"></div>
    <div class="signal-alert hidden" id="parityAlert"></div>
    <div>
      <button class="btn-buy" id="btnOdd" disabled>ÍMPAR</button>
      <button class="btn-sell" id="btnEven" disabled>PAR</button>
    </div>
    <div class="signal-alert hidden" id="differAlert"></div>
    <button class="btn-buy" id="btnDiffer" disabled>🎯 DIFFER</button>
  </div>
</div>

<script>
// ══════════════ ESTADO GLOBAL ══════════════
let _updateInterval = null;
let isConnected = false;

function $_(id) { return document.getElementById(id); }

function toast(msg, type='info', ms=3500) {
  const t = $_('toast'); if (!t) return;
  t.className = 'toast show ' + type; t.innerHTML = msg;
  clearTimeout(t._t); t._t = setTimeout(() => { t.className = 'toast'; }, ms);
}

function startPolling() { if (_updateInterval) return; scheduleNextPoll(); }
function stopPolling() { if (_updateInterval) { clearTimeout(_updateInterval); _updateInterval = null; } }
function scheduleNextPoll() {
  const d = isConnected ? 3000 : 8000;
  _updateInterval = setTimeout(async () => {
    try { await updateAll(); } catch(e) { console.error(e); }
    scheduleNextPoll();
  }, d);
}

async function updateAll() {
  const resp = await fetch('/api/status');
  const data = await resp.json();
  if (data.error) return;

  const bot = data.bot || {};
  const digits = data.digits || {};
  const strategy = data.strategy || {};

  isConnected = bot.connected && bot.authorized;
  $_('conSt').textContent = isConnected ? 'Conectado' : 'Desconectado';
  $_('bal').textContent = (bot.balance || 0).toFixed(2);
  $_('cur').textContent = bot.currency || 'USD';

  // Dígitos
  const recent = digits.recent || [];
  if (recent.length > 0) {
    const newest = recent[recent.length - 1];
    const isOdd = newest % 2 !== 0;
    const bd = $_('bigD'); bd.textContent = newest; bd.className = 'big-d ' + (isOdd ? 'odd' : 'even');
    const bp = $_('bigP'); bp.textContent = isOdd ? 'ÍMPAR' : 'PAR'; bp.className = 'big-p ' + (isOdd ? 'odd' : 'even');
    let html = ''; recent.forEach(d => html += `<div class="dbox ${d%2?'odd':'even'}">${d}</div>`);
    $_('histRow').innerHTML = html;
  }

  // PAR/ÍMPAR
  const parityAlert = $_('parityAlert');
  if (strategy.parity_available) {
    const dir = strategy.parity_direction;
    const reason = strategy.parity_reason || '';
    $_('btnOdd').disabled = (dir === 'even');
    $_('btnEven').disabled = (dir === 'odd');
    parityAlert.textContent = '🎯 ' + reason;
    parityAlert.classList.remove('hidden');
  } else {
    $_('btnOdd').disabled = true;
    $_('btnEven').disabled = true;
    parityAlert.textContent = strategy.parity_reason || 'Sem sinal';
    parityAlert.classList.remove('hidden');
  }

  // DIFFER
  const differAlert = $_('differAlert');
  if (strategy.differ_available) {
    $_('btnDiffer').disabled = false;
    differAlert.textContent = '🎯 DIFFER disponível no dígito ' + strategy.differ_digit;
    differAlert.classList.remove('hidden');
  } else {
    $_('btnDiffer').disabled = true;
    differAlert.textContent = 'DIFFER indisponível';
    differAlert.classList.remove('hidden');
  }
}

// Funções de conexão (mantidas iguais às versões anteriores)
async function conectar() {
  const token = prompt('Cole o token:');
  if (!token) return;
  await fetch('/api/auth/save_token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, account_type: 'demo' })
  });
  await fetch('/api/connect', { method: 'POST' });
  toast('✅ Token guardado. A conectar...', 'info');
}

async function connectWithDeriv() {
  const r = await fetch('/api/auth/deriv_oauth_url');
  const d = await r.json();
  if (d.error) { toast('❌ ' + d.error, 'loss'); return; }
  window.open(d.url, 'derivOAuth', 'width=800,height=700');
}

// Inicialização
startPolling();
</script>
</body>
</html>
